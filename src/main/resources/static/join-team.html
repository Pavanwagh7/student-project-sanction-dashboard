<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Join Team</title>
</head>

<body>

<div>

    <div>
        <h1>Join Team</h1>
    </div>

    <br>

    <div>

        <label for="teamCode">Enter Team Code</label>

        <input
                type="text"
                id="teamCode"
                name="teamCode"
                placeholder="Enter team code"
        >

    </div>

    <br>

    <div>

        <button onclick="joinTeam()">
            Request to Join
        </button>

        <button onclick="window.location.href='dashboard.html'">
            Back
        </button>

    </div>

    <p id="message"></p>

</div>


<script>

    function joinTeam() {

        let teamCode =
            document.getElementById("teamCode").value;

        if (teamCode.trim() === "") {

            document.getElementById("message").innerText =
                "Enter team code.";

            return;
        }

        fetch("/my_team/join", {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                teamCode: teamCode
            })

        })

        .then(response => response.text())

        .then(data => {

            document.getElementById("message").innerText = data;

        })

        .catch(error => {

            console.log(error);

            document.getElementById("message").innerText =
                "Something went wrong.";

        });

    }

</script>

</body>
</html>
