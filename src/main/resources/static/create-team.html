
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Team</title>

    <!-- CSS -->
    <link rel="stylesheet" href="css/create-team.css">
</head>

<body>

<div class="container">

    <div class="header">
        <h1>Create Team</h1>
    </div>

    <div class="team-form">

        <label for="teamName">Team Name</label>

        <input
                type="text"
                id="teamName"
                name="teamName"
                placeholder="Enter team name"
        >

        <p class="info">
            Maximum members allowed in the team = 4
        </p>

    </div>

    <div class="buttons">

        <button
                type="button"
                class="create-btn"
                onclick="createTeam()">
            Create Team
        </button>

        <button
                type="button"
                class="back-btn"
                onclick="window.location.href='dashboard.html'">
            Back
        </button>

    </div>

    <p id="message"></p>

</div>

<!-- JavaScript -->
<script src="js/create-team.js"></script>

</body>

</html>
